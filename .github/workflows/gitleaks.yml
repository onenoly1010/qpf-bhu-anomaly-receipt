# Secret scan of the full git history with gitleaks' DEFAULT ruleset.
# MANUAL ONLY: the sole trigger is workflow_dispatch, so it never runs on a
# push, tag or pull request. Someone with write access has to start it from
# the Actions tab (or the API). It does nothing locally. Whenever it runs, the
# commits it scans are already on GitHub: it detects after publication and
# blocks nothing.
name: gitleaks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # actions/checkout tag v4 (= v4.4.0), pinned to its commit SHA; resolved
      # read-only with `git ls-remote https://github.com/actions/checkout refs/tags/v4`
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (official release, sha256 checked)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c --strict -
          tar xzf "$f" gitleaks
      - name: Refuse custom gitleaks config or allowlist
        run: |
          for f in .gitleaks.toml .gitleaksignore; do
            if [ -e "$f" ]; then echo "$f present: default ruleset only"; exit 1; fi
          done
      - name: Scan full history (default rules, no inline allows)
        run: ./gitleaks git --redact --no-banner --verbose --ignore-gitleaks-allow .
